# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# Increased heap to 4 GB and Metaspace to 1 GB to avoid GC pressure and Lint service leaks.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Enable parallel project execution for faster multi-module builds.
# Capacitor apps have multiple subprojects (capacitor-android, plugins etc.)
# that can be compiled simultaneously — this cuts build time significantly.
org.gradle.parallel=true

# Enable Gradle build caching — reuses outputs from previous builds
org.gradle.caching=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false

# R8 Full Mode: more aggressive dead-code elimination and class merging.
# Reduces APK size 5-10% and speeds up startup (fewer classes for Dalvik to load).
# Safe because we have proguard-android-optimize.txt as the base config.
android.enableR8.fullMode=true

# Workaround for "Failed to stop service 'LintClassLoaderBuildService'"
# Runs lint in a separate process to avoid ClassLoader leaks in the Gradle daemon.
android.experimental.runLintInProcess=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
