// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
        classpath 'com.google.gms:google-services:4.4.2'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.6'
        classpath 'com.github.triplet.gradle:play-publisher:3.11.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

plugins {
    id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    // Force the newer androidx.credentials versions globally to resolve the strict-version
    // conflict between capacitor-firebase-authentication (pins 1.2.0-rc01) and the
    // newer credentials versions required for Google Sign-In on some Android devices.
    configurations.all {
        resolutionStrategy {
            force "androidx.credentials:credentials:${rootProject.ext.androidxCredentialsVersion}"
            force "androidx.credentials:credentials-play-services-auth:${rootProject.ext.androidxCredentialsPlayServicesAuthVersion}"
            force "com.google.android.libraries.identity.googleid:googleid:${rootProject.ext.librariesIdentityGoogleidVersion}"
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}